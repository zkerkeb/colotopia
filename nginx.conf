map_hash_bucket_size 256;
map_hash_max_size 65536;
map $uri $colotopia_legacy_redirect {
    default "";
    include /etc/nginx/colotopia-redirects.map;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    error_page 404 /404.html;

    # This old spelling differs only by case: nginx map strings ignore case,
    # and macOS cannot build both spellings as separate directories.
    location ~ ^/fr/coloriage/noel-renne-Rudolf/?$ { return 301 /fr/coloriage/noel-renne-rudolf/$is_args$args; }

    # Consolidate duplicate collections while preserving existing links.
    location ~ ^/fr/licornes(?:/(.*))?$ { return 301 /fr/licorne/$1$is_args$args; }
    location ~ ^/fr/fees(?:/(.*))?$ { return 301 /fr/fee/$1$is_args$args; }
    location ~ ^/en/unicorns-2(?:/(.*))?$ { return 301 /en/unicorns/$1$is_args$args; }
    location ~ ^/en/fairies-2(?:/(.*))?$ { return 301 /en/fairies/$1$is_args$args; }


    # Prevent absolute redirects from using http:// when behind SSL termination
    absolute_redirect off;
    if ($host = www.colotopia.com) { return 301 https://colotopia.com$request_uri; }
    if ($colotopia_legacy_redirect != "") { return 301 $colotopia_legacy_redirect$is_args$args; }

    location = /_redirects.nginx { return 404; }

    # Security and SEO headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Revalidate HTML and JSON on each visit; immutable/static resources below
    # have their own cache policy. Avoid heuristic caching of old navigation.
    add_header Cache-Control "no-cache" always;

    # Server-side redirect root to French locale
    location = / {
        return 301 /fr/;
    }

    # Proxy CDN images so same-origin PDF generation works (no CORS issues)
    location ^~ /cdn/ {
        proxy_pass https://cdn.colotopia.com/;
        proxy_set_header Host cdn.colotopia.com;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 1d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "https://colotopia.com";
    }

    # Serve only files generated by Astro. Do not fall back to /index.html for
    # unknown paths, otherwise stale or mistyped URLs look like valid pages to
    # crawlers and dilute canonical signals.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Packs are downloaded from their HTML collection; keep search results on that page.
    location ^~ /packs/ {
        try_files $uri =404;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|pdf)$ {
        expires 1d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Only fingerprinted Astro assets are immutable. Images may be regenerated.
        add_header Cache-Control "public";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
