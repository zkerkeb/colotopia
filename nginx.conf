server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent absolute redirects from using http:// when behind SSL termination
    absolute_redirect off;

    # Server-side redirect root to French locale
    location = / {
        return 301 /fr/;
    }

    # Proxy CDN images so same-origin PDF generation works (no CORS issues)
    location /cdn/ {
        proxy_pass https://cdn.colotopia.com/;
        proxy_set_header Host cdn.colotopia.com;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "https://colotopia.com";
    }

    # Handle SPA-style routing for Astro
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
